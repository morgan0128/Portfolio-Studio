name: AlbumController Unit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  album-controller-tests:
    name: AlbumController unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore WebApplication6.sln

      - name: Create Six Labors license file
        env:
          SIXLABORS_LICENSE_CONTENT: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          umask 077
          printf '%s' "$SIXLABORS_LICENSE_CONTENT" > WebApplication6/sixlabors.lic
    
      - name: Build
        run: dotnet build WebApplication6.sln --configuration Release --no-restore
    
      - name: Run AlbumController unit tests
        run: >
          dotnet test
          --project WebApplication6.Tests/WebApplication6.Tests.csproj
          --configuration Release
          --no-build
          --filter-class "WebApplication6.Tests.Tests.Unit.Controllers.AlbumControllerUnitTests"
    
#      - name: Upload test results
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: album-controller-test-results
#          path: TestResults
              
      - name: Remove temporary license
        if: always()
        run: rm -f WebApplication6/sixlabors.lic
