<main>

  <div>
    <app-navbar [adminPreviewMode]="true" (requestNavToEditAlbums)="requestNavToEditAlbums.emit(album().id)"
                (adminModeBlockedNavigation)="alert('Cannot navigate between pages in Admin Preview Mode.')" />
  </div>

  <div class="portfolio-items" #portfolioItems>
      @if (!loadingItems() && !loadingItemsError()){
        @for (row of rows(); track row.key){
          @if (row.kind === 'photos') {
            <div class="photo-row" [style.inline-size.px]="row.width">
              @for (photo of row.photos; track photo.item.id) {
                <div class="photo-item" [style.inline-size.px]="photo.width">
                  <app-portfolio-page-photo-display [item]="photo.item" />
                </div>
              }
            </div>
          } @else {
            <div class="collection-row">
              <app-portfolio-page-photo-display-collection [item]="row.item" />
            </div>
          }
        }
      }

  </div>

</main>
