<nav>
  <ol>
    @if (selectedMayBeAdded()){
      <button (click)="navInsertSelectedAtOrder.emit(0)">add</button>
    } @else if (selectedMayBePublishedThenAdded()){
      <button (click)="navPublishThenInsertSelectedAtOrder.emit(0)">publish and add</button>
    }
    @for (n of navbarItems(); track n.id){
      @if (n.published){
        <li
          class="pp-nav-title"
          [appReorderGlow]="reorderGlows()[n.id]"
        >
          <button class="reorder-button" (click)="reorderInNavBackwardRequest.emit(n.id)"><</button>
          {{ n.navTitle }}
          <button class="reorder-button" (click)="reorderInNavForwardRequest.emit(n.id)">></button>
          <button class="remove-button" (click)="removeFromNavRequest.emit(n.id)">Remove</button>
        </li>
        @if (selectedMayBeAdded()){
          <button (click)="navInsertSelectedAtOrder.emit(n.navbarOrder + 1)">add</button>
        } @else if (selectedMayBePublishedThenAdded()){
          <button (click)="navPublishThenInsertSelectedAtOrder.emit(n.navbarOrder + 1)">publish and add</button>
        }
      }
    }
  </ol>
</nav>
