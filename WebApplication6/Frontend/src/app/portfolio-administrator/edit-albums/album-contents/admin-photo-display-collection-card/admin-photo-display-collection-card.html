<div class="collection-card">
  @if (selectedPhotoDisplay() !== null){
    <app-admin-photo-display-card
      [albumId]="albumId()"
      [item]="selectedPhotoDisplay()!"
      (stateChange)="internalPhotoDisplayStateChange($event)"
      (photoDetailedViewRequest)="internalPhotoDetailedViewRequest.emit($event)"
    />
    <button class="collection-nav" (click)="prevPhoto()"><</button>
    <button class="collection-dissolve">&times;</button>
    <button class="collection-nav" (click)="nextPhoto()">></button>
  }
</div>
