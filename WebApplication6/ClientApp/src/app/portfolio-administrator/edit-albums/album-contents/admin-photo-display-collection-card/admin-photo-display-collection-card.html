<div>
  @if (selectedPhotoDisplay() !== null){
    <app-admin-photo-display-card
      [albumId]="albumId()"
      [item]="selectedPhotoDisplay()"
      [photoDisplay]="item.selected"
      (stateChanged)="itemStateChanged.emit($event)"
      (photoDetailedViewRequest)="handleDetailedPhotoViewRequest($event)"
      [groupingView]="collectionGroupingView()"
      [includeInNewGroup]="getCollectionGroupingOptStatus(item.id)"
      (collectionGroupingOptStatusChanged)="handlePhotoOptChangeEvent(item.id, $event)
    />
  }
</div>
