<section class="card portfolio-card">
<!--    <label class="field-label" for="albums">Album</label>-->
  <div class="styling-select-container">
    <label for="stylings">Styling</label>
    <select
      class="styling-select"
      name="stylings"
      id="stylings"
      [(ngModel)]="selectedStyleLayout"
    >
      <option [ngValue]="null">Page Styling</option>
      @for (s of stylingLayouts(); track s){
        @let sCapitalized = s.at(0)!.toLocaleUpperCase() + s.substring(1, s.length);
        <option [ngValue]="s">{{ sCapitalized }}</option>
      }
    </select>
    <div class="styling-select-buttons">
      <button>preview</button>
      <button (click)="onApplyStyling()">apply</button>
    </div>

  </div>

  <div>

  </div>

  <div class="portfolio-visibility-manager">
    <div>
      @if (!portfolioPage()?.published){
        <button (click)="publish()">Publish</button>
        <p class="unpublished">This item is not published</p>
      } @else {
        <button (click)="unpublish()">Unpublish</button>
        <p class="published">Published</p>
      }
    </div>
    <div>
      <button (click)="requestNavbarView()">Edit Navbar</button>
      <p>This item is not displayed in the Navbar</p>
    </div>
    @if (viewingNavbarState()){
      <div>
        @for (n of navbarItems(); track n.id){
          <p>{{ n.navTitle }}</p>
        }
      </div>
    }
  </div>
